name: Windows x64 Build & Test

# Modeled after ext/async/.github/workflows/build-windows.yml.
# Same approach: clone php-src + ext/async, copy this repo into
# ext/http_server/, build the whole PHP statically with the
# extension enabled. Avoids the phpize/shared-extension dance.
#
# Skipped vs. Linux CI:
#   - HTTP/3 (no prebuilt ngtcp2/nghttp3 on the PHP SDK).
#   - io_uring (Linux-only).
#
# libuv and nghttp2 come from vcpkg, get copied into the SDK
# deps tree before configure runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PHP_SRC_BRANCH: true-async
  PHP_ASYNC_BRANCH: main

jobs:
  windows:
    name: WINDOWS_X64_ZTS_RELEASE
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
      PHP_BUILD_OBJ_DIR: C:\obj
      PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
      PHP_BUILD_SDK_BRANCH: php-sdk-2.7.1
      PHP_BUILD_CRT: vs18
      PLATFORM: x64
      THREAD_SAFE: "1"
      INTRINSICS: AVX2
      PARALLEL: -j2
      OPCACHE: "1"

    steps:
      - name: git config (keep LF, do not autocrlf)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout php-src (true-async-stable) to root
        uses: actions/checkout@v5
        with:
          repository: true-async/php-src
          ref: ${{ env.PHP_SRC_BRANCH }}

      - name: Checkout ext/async
        uses: actions/checkout@v5
        with:
          repository: true-async/php-async
          ref: ${{ env.PHP_ASYNC_BRANCH }}
          path: async-src

      - name: Copy ext/async into ext/async
        shell: cmd
        run: |
          if not exist ext\async mkdir ext\async
          xcopy /E /I /H /Y async-src ext\async

      - name: Checkout http_server
        uses: actions/checkout@v5
        with:
          path: http-server-src

      - name: Copy http_server into ext/http_server
        shell: cmd
        run: |
          if not exist ext\http_server mkdir ext\http_server
          xcopy /E /I /H /Y http-server-src ext\http_server

      - name: Replace .github with http_server's
        shell: cmd
        run: |
          xcopy /E /I /H /Y http-server-src\.github .github

      - name: Drop the staging checkouts from the php-src root
        shell: cmd
        run: |
          rem buildconf's find_config_w32(".") scans every directory in the
          rem php-src root for a config.w32, so each staging checkout registers
          rem as a module of its own beside the copy under ext/. The names
          rem differ, nothing is deduplicated, and every ARG_ENABLE lands twice;
          rem the duplicate is never matched on the command line, so the loop
          rem that applies defaults resets PHP_ASYNC and PHP_TRUE_ASYNC_SERVER
          rem to 'no' after the flags had turned them on. Neither extension is
          rem built and configure reports nothing. See true-async/php-async#270.
          rmdir /s /q async-src
          rmdir /s /q http-server-src

      - name: Setup libuv + nghttp2 (vcpkg)
        shell: powershell
        run: |
          if (!(Test-Path "C:\vcpkg")) {
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          C:\vcpkg\vcpkg.exe install libuv:x64-windows nghttp2:x64-windows

      # The runner's curl (System32 and Git's) has no nghttp2, and the HTTP/2
      # tests skip without it; the curl.se build links it. h2spec feeds h2/009.
      # h2load has no Windows build (#407).
      - name: Setup curl with HTTP/2 and h2spec
        shell: powershell
        run: |
          $tools = "C:\h2-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -Uri "https://curl.se/windows/latest.cgi?p=win64-mingw.zip" -OutFile "$tools\curl.zip"
          Expand-Archive -Path "$tools\curl.zip" -DestinationPath $tools
          $curlBin = (Get-ChildItem -Directory "$tools\curl-*").FullName + "\bin"
          & "$curlBin\curl.exe" --version
          if (-not ((& "$curlBin\curl.exe" --version) -match "nghttp2")) { throw "curl has no nghttp2" }
          $curlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Invoke-WebRequest -Uri "https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_windows_amd64.zip" -OutFile "$tools\h2spec.zip"
          Expand-Archive -Path "$tools\h2spec.zip" -DestinationPath "$tools\h2spec"
          "H2SPEC=$tools\h2spec\h2spec.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build PHP + http_server
        run: .github/scripts/windows/build.bat

      # run-tests.php discards a retried test's first attempt, so a test that
      # passes on the retry leaves only its name; the patch prints that
      # attempt's diff, and a php-src it no longer applies to fails here (#313).
      # It also prints the signal a crashed test died of, which run-tests.php
      # reads from stopsig and so always prints as Termsig=0 (#345).
      - name: Patch run-tests.php to print a retried test's first diff and a crash's signal
        run: git apply .github/scripts/run-tests.patch

      - name: Test http_server (phpt)
        run: .github/scripts/windows/test.bat

      - name: Upload failing test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phpt-failures-windows-${{ github.run_id }}
          path: |
            ext/http_server/tests/phpt/**/*.out
            ext/http_server/tests/phpt/**/*.diff
            ext/http_server/tests/phpt/**/*.log
          if-no-files-found: ignore
          retention-days: 7
